# Render Blueprint: one free web service built from the Dockerfile.
# Render dashboard -> New -> Blueprint -> pick this repo, then paste GOOGLE_API_KEY when asked.
services:
  - type: web
    name: clinic-front-desk-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDINGS_PROVIDER
        value: local
      - key: GOOGLE_API_KEY
        sync: false   # you paste it in the Render dashboard; never commit it
