<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Front-Desk Agent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --brand:#0f766e; --user:#e6f4f1; --line:#e4e7ec; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:720px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; height:100vh; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; margin:8px 0; white-space:pre-wrap; }
  .user { background:var(--user); margin-left:auto; }
  .bot { background:#f2f4f7; }
  .confirm { display:flex; gap:8px; margin-top:8px; }
  button { font:inherit; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  .yes { background:var(--brand); color:#fff; } .no { background:#e4e7ec; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  form button { background:var(--brand); color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Green Valley Family Clinic: AI front desk</h1>
  <p class="sub">Demo with fictional data. Try: "When are you open?", "I want to book a dermatologist", "My number is 03001234567".</p>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Type a message…" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  let threadId = null;

  function add(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function render(data) {
    threadId = data.thread_id;
    const div = add(data.reply, "bot");
    if (data.pending_confirmation) {
      const row = document.createElement("div");
      row.className = "confirm";
      for (const [label, approved, cls] of [["Yes, book it", true, "yes"], ["No", false, "no"]]) {
        const b = document.createElement("button");
        b.textContent = label; b.className = cls;
        b.onclick = async () => {
          row.remove();
          add(label, "user");
          const res = await fetch(`/chat/${threadId}/confirm`, {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({approved}),
          });
          render(await res.json());
        };
        row.appendChild(b);
      }
      div.appendChild(row);
    }
  }

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    add(message, "user");
    const res = await fetch("/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, thread_id: threadId}),
    });
    if (!res.ok) { add((await res.json()).detail || "Something went wrong.", "bot"); return; }
    render(await res.json());
  };
</script>
</body>
</html>
